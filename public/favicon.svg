<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- Outer Ring -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="url(#brandGrad)" stroke-width="10" opacity="0.3" />

  <!-- Inner Brand Container -->
  <rect x="96" y="96" width="320" height="320" rx="72" fill="url(#brandGrad)" />

  <!-- Monogram Text "AO" -->
  <text x="256" y="295" font-family="Georgia, 'Times New Roman', serif" font-size="140" font-weight="900" fill="url(#textGrad)" text-anchor="middle" letter-spacing="2">AO</text>

  <!-- Accent Chart Growth Line -->
  <path d="M 160 350 L 220 330 L 270 340 L 350 290" fill="none" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <polygon points="350,280 360,298 340,295" fill="#f59e0b" />
</svg>